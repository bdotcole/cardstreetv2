apply plugin: 'com.android.application'

// Signing credentials live in android/keystore.properties (gitignored).
// Create one with:
//   storeFile=cardstreet_key.jks
//   storePassword=...
//   keyAlias=cardstreet
//   keyPassword=...
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.cardstreet.tcg"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cardstreet.tcg"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 19
        versionName "1.0.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Only configure release signing if keystore.properties exists.
            // This lets the project build without it (debug builds, CI without
            // signing) instead of failing the Gradle configure phase.
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// ---------------------------------------------------------------------------
// Release safety net — never ship a shell without its synced web assets.
//
// `src/main/assets/capacitor.config.json` and `src/main/assets/public/` are
// GENERATED by `npx cap sync android`; they are NOT committed to git. A release
// built in a tree where that sync never ran packages an EMPTY assets dir, which
// Gradle signs without complaint. The resulting app has no server.url, so
// Capacitor boots to https://localhost/ and dies with ERR_CONNECTION_REFUSED.
// This shipped live once (versionCode 13, 2026-07-01) and bricked every user.
// Fail the build here instead of discovering it in production.
def verifyCapacitorAssets = tasks.register('verifyCapacitorAssets') {
    doLast {
        def hint = 'Run `npx cap sync android` from the project root, then rebuild.'
        def configFile = file('src/main/assets/capacitor.config.json')
        if (!configFile.exists()) {
            throw new GradleException("Capacitor sync missing: ${configFile} not found. ${hint}")
        }
        if (!(configFile.text =~ /"url"\s*:\s*"https:\/\/cardstreet\.app"/)) {
            throw new GradleException("capacitor.config.json has no server.url=https://cardstreet.app — the app would boot to localhost. ${hint}")
        }
        def indexFile = file('src/main/assets/public/index.html')
        if (!indexFile.exists()) {
            throw new GradleException("Capacitor web assets missing: ${indexFile} not found. ${hint}")
        }
    }
}

// configureEach is lazy, so this also binds to the release tasks the Android
// Gradle Plugin registers later in the configuration phase.
tasks.matching { it.name == 'bundleRelease' || it.name == 'assembleRelease' }.configureEach {
    dependsOn verifyCapacitorAssets
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Meta (Facebook) SDK - app-event + install attribution for Meta Ads.
    // Events-only artifact (no Login/Share), mirroring the iOS FacebookCore SPM
    // package. The SDK ships its own consumer ProGuard rules in the AAR, so no
    // entries are needed in proguard-rules.pro despite release minification.
    // Pinned to a confirmed 18.x; bumpable to any newer 18.x patch.
    implementation 'com.facebook.android:facebook-core:18.1.3'
    // Play Install Referrer - reads the referrer= param a /join/[slug] redirect
    // attached to the Play Store link, so partner QR installs earn credit
    // (InstallReferrerPlugin -> lib/installReferrer.ts -> /api/referrals/install).
    implementation 'com.android.installreferrer:installreferrer:2.2'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
