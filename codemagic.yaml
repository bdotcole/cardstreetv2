# Codemagic CI for the CardStreet iOS app (Capacitor wrapper).
#
# This builds and signs the iOS shell that loads https://cardstreet.app, the
# same pattern the Android app uses. No Mac required locally — Codemagic runs
# the Xcode build on a hosted macOS machine and uploads to TestFlight.
#
# ONE-TIME SETUP in the Codemagic UI before the first run:
#   1. Connect this repo (Codemagic > Add application).
#   2. Teams > Integrations > App Store Connect: add an API key, and note the
#      integration name. Put that name in `app_store_connect.api_key` below
#      (here referenced as the env group / integration `app_store_connect`).
#   3. Code signing: use "Automatic" with the App Store Connect API key so
#      Codemagic fetches/creates the distribution cert + provisioning profile.
#   4. Register the bundle id `com.cardstreet.tcg` in App Store Connect and
#      create the app record there (same id as Android's appId).
#
# Apple review blockers tracked separately (see IOS_LAUNCH.md):
#   - Sign in with Apple (required because Google sign-in is offered)
#   - Working in-app account deletion
#   - APNs key in Firebase for push

workflows:
  ios-release:
    name: CardStreet iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CardStreet ASC API Key   # <-- match the integration name you create in Codemagic
    environment:
      groups:
        - ios_signing   # must contain CERTIFICATE_PRIVATE_KEY (secure) — see setup note below
      vars:
        BUNDLE_ID: "com.cardstreet.tcg"
        # Capacitor 8 scaffolds iOS with Swift Package Manager, so we build the
        # .xcodeproj directly (there is no CocoaPods .xcworkspace).
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci

      # The Capacitor app loads the live site (server.url in capacitor.config.ts),
      # so webDir only needs to exist for `cap sync` to copy. Mirror Android,
      # which ships just the Cordova shim — generate a minimal placeholder.
      - name: Create placeholder webDir
        script: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>CardStreet</title>
          <body style="background:#0f1419"></body>
          HTML

      - name: Capacitor sync (copy web assets + resolve Swift packages)
        script: npx cap sync ios

      # Release safety net — never ship a shell without its synced web assets.
      # iOS twin of the verifyCapacitorAssets Gradle task in
      # android/app/build.gradle: capacitor.config.json + public/ are GENERATED
      # by cap sync above (not committed), and a config without server.url boots
      # the WebView to the blank bundled placeholder instead of cardstreet.app.
      # That exact miss shipped live on Android once (versionCode 13,
      # 2026-07-01) and bricked every user. Xcode only catches the file being
      # absent (it's in the Resources phase); content is checked here, before
      # the signing + build minutes are spent and TestFlight auto-submit fires.
      - name: Verify Capacitor assets (server.url guardrail)
        script: |
          set -e
          CONFIG=ios/App/App/capacitor.config.json
          HINT='Run `npx cap sync ios` and check capacitor.config.ts.'
          if [ ! -f "$CONFIG" ]; then
            echo "FAIL: $CONFIG not generated — did cap sync run? $HINT"; exit 1
          fi
          if ! grep -Eq '"url"[[:space:]]*:[[:space:]]*"https://cardstreet\.app"' "$CONFIG"; then
            echo "FAIL: $CONFIG has no server.url=https://cardstreet.app — the app would boot to a blank localhost page. $HINT"
            cat "$CONFIG"; exit 1
          fi
          # middleware.ts + Pro native-shell detection key off this UA marker;
          # without it the app is served the desktop site.
          if ! grep -Eq '"appendUserAgent"[[:space:]]*:[[:space:]]*"CardStreetApp"' "$CONFIG"; then
            echo "FAIL: $CONFIG lost appendUserAgent=CardStreetApp. $HINT"
            cat "$CONFIG"; exit 1
          fi
          if [ ! -f ios/App/App/public/index.html ]; then
            echo "FAIL: ios/App/App/public/index.html missing — cap sync did not copy web assets. $HINT"; exit 1
          fi
          echo "OK: capacitor.config.json server.url + UA marker + web assets verified"

      - name: Set build number from Codemagic counter
        script: |
          cd ios/App
          agvtool new-version -all $(($PROJECT_BUILD_NUMBER))

      # Explicit signing: fetch the distribution cert + App Store profile, CREATING
      # them via the App Store Connect API key if they don't exist yet (the automatic
      # ios_signing block only fetches pre-existing profiles, which is why the first
      # build failed with "No matching profiles found").
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates

      - name: Build and sign IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip to true and add reviewer notes once the review blockers are cleared:
        submit_to_app_store: false
